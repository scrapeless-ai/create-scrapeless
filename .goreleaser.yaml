version: 1
project_name: create-scrapeless

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - binary: create-scrapeless
    ldflags:
      - -s -w -X github.com/scrapeless-ai/create-scrapeless/cmd.Version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - 386
      - arm64

archives:
  - name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}'
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
